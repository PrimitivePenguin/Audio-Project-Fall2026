# Local development profile: uses an embedded H2 database instead of Postgres.
# No .env or Postgres install required.
# Run with:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local

# File-based H2 so accounts survive restarts (stored in ./data/, delete it to reset).
# MODE=PostgreSQL keeps SQL behaviour close to production.
spring.datasource.url=jdbc:h2:file:./data/localdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Browse the DB at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password)
spring.h2.console.enabled=true
